[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle errors, pyflakes, isort
ignore = [
    "E501",   # line too long — enforced by line-length above, not as an error
]
exclude = [".venv", "questdb_data", "synced_data"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests/unit"]
