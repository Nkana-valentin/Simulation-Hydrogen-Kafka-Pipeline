# docker-compose.yml

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  broker:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OPTS: "-Djava.net.preferIPv4Stack=true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  questdb:
    image: questdb/questdb:latest
    container_name: custom_questdb
    restart: always
    ports:
      - "9000:9000"
      - "8812:8812"
    environment:
      - QDB_PG_USER=${QUESTDB_USER}
      - QDB_PG_PASSWORD=${QUESTDB_PASSWORD}
    volumes:
      - ./questdb_data:/var/lib/questdb
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  kafka_producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    container_name: kafka_producer
    depends_on:
      broker:
        condition: service_healthy
      fastapi_app:
        condition: service_started
    environment:
      - KAFKA_BROKER=${KAFKA_BROKER}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
    env_file:
      - .env
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  kafka_consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    container_name: kafka_consumer
    depends_on:
      broker:
        condition: service_healthy
      questdb:
        condition: service_started
    ports:
      - "8001:8001"
    environment:
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_TOPIC=${KAFKA_TOPIC_RAW}
      - QUESTDB_HOST=${QUESTDB_HOST}
      - QUESTDB_PORT=${QUESTDB_PORT}
    env_file:
      - .env
    volumes:
      - ./TSDB.yml:/app/TSDB.yml
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  fastapi_app:
    build: .
    container_name: fastapi_app
    ports:
      - "${FASTAPI_PORT}:8000"
    environment:
      - QUESTDB_HOST=${QUESTDB_HOST}
      - QUESTDB_PORT=${QUESTDB_PORT}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - REMOTE_SYNC_ENABLED=${REMOTE_SYNC_ENABLED}
      - SSH_HOST=${SSH_HOST}
      - SSH_USER=${SSH_USER}
      - SSH_REMOTE_PATH=${SSH_REMOTE_PATH}
      - SSH_KEY_PATH=${SSH_KEY_PATH}
    env_file:
      - .env
    networks:
      - app_network
    restart: on-failure
    volumes:
      - ./synced_data:/app/synced_data
      # Mount only the specific key needed, not the entire ~/.ssh directory.
      # Set SSH_KEY_FILE in .env to the filename of your private key (e.g. id_ed25519).
      - ${SSH_KEY_DIR:-~/.ssh}/${SSH_KEY_FILE:-id_ed25519}:/app/.ssh/id_ed25519:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - fastapi_app
      - kafka_consumer
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in .env — never use the default in any
      # deployment that is reachable from outside localhost.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - QUESTDB_USER=${QUESTDB_USER}
      - QUESTDB_PASSWORD=${QUESTDB_PASSWORD}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - questdb
    networks:
      - app_network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  app_network:
    driver: bridge
