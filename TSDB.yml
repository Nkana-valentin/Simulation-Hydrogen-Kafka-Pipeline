# TSDB.yml - Configuration for QuestDB, Kafka, and SISSA API
questdb:
  host: "localhost"
  port: 9000
  username: "admin"
  password: "quest"
  database: "qdb"
  
  tables:
    hydrogen_data:
      create_sql: |
        CREATE TABLE IF NOT EXISTS hydrogen_data (
          timestamp TIMESTAMP,
          lab SYMBOL,
          sensor SYMBOL,
          measurement_type SYMBOL,
          value DOUBLE
        ) TIMESTAMP(timestamp) PARTITION BY DAY;

kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    raw_data: "h2_lab_raw"
    validated_data: "h2_lab_data"
  
sissa:
  api_endpoint: "https://sissa-hydor.example.com/api"
  sync_interval: "30s"  # Sync every 30 seconds
  auth_token: "${SISSA_API_TOKEN}"
  #api_base_url: ${SISSA_API_URL:https://api.sissa-hydor.it/v1}
  allowed_ips:
    - 193.xxx.0.0/16
    - 2001:xxx::/32
    
security:
  api_keys:
    sissa_hydor_01: ${SISSA_API_KEY_1}
    sissa_hydor_02: ${SISSA_API_KEY_2}    

remote_sync:
  enabled: false  # Set to true to enable
  method: "api"   # "api", "ssh", or "both"
  api_endpoint: "http://other-computer:8000/api/data"
  api_token: "your-token-here"
  ssh:
    host: "other-computer.local"
    username: "your-username"
    password: "your-password"  # Optional, use key if possible
    key_path: "/path/to/ssh/key"
    path: "/home/username/synced_data"    
