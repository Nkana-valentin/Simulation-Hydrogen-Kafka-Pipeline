questdb:
  host: ${QUESTDB_HOST}
  port: ${QUESTDB_PORT}
  username: ${QUESTDB_USER}
  password: ${QUESTDB_PASSWORD}
  database: ${QUESTDB_DATABASE}

kafka:
  bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS}
  topics:
    raw_data: ${KAFKA_TOPIC_RAW}
    validated_data: ${KAFKA_TOPIC_VALIDATED}

security:
  api_keys:
    sissa_hydor_01: ${SISSA_API_KEY_1}
    sissa_hydor_02: ${SISSA_API_KEY_2}

BATCH_SIZE: ${BATCH_SIZE}

remote_sync:
  enabled: true
  method: ssh
  ssh:
    host: ${SSH_HOST}
    username: ${SSH_USER}
    password: ${SSH_PASSWORD}
    key_path: ${SSH_KEY_PATH}
    path: ${SSH_REMOTE_PATH}
    allow_agent: false
    look_for_keys: false
    timeout: 10

sissa:
  api_endpoint: https://sissa-hydor.example.com/api
  auth_token: ${SISSA_API_TOKEN}
  auto_sync: true
  sync_interval: ${SYNC_INTERVAL}