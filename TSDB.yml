# TSDB.yml - Configuration for QuestDB, Kafka, and SISSA API
questdb:
  host: "localhost"
  port: 9000
  username: "admin"
  password: "quest"
  database: "qdb"
  
  tables:
    hydrogen_data:
      create_sql: |
        CREATE TABLE IF NOT EXISTS hydrogen_data (
          timestamp TIMESTAMP,
          lab SYMBOL,
          sensor SYMBOL,
          measurement_type SYMBOL,
          value DOUBLE
        ) TIMESTAMP(timestamp) PARTITION BY DAY;

kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    raw_data: "h2_lab_raw"
    validated_data: "h2_lab_data"
  
    
security:
  api_keys:
    sissa_hydor_01: ${SISSA_API_KEY_1}
    sissa_hydor_02: ${SISSA_API_KEY_2}    
  


remote_sync:
  enabled: true
  method: ssh
  ssh:
    # Use one of these IPs (10.128.2.80 is usually best)
    host: 195.14.102.215
    # Alternative: host: 10.128.4.15
    # Alternative: host: 10.128.6.80
    username: vnkanang
    password: "your-password"  # Option 1 (not recommended)
    # Your home directory path
    #path: "/u/mdmc/vnkanang/synced_data"
    #key_path: "~/.ssh/id_rsa"  # Option 2 (recommended)
    #key_path: /home/valentinnkana/.ssh/id_rsa
    # OR if you have scratch access
    path: /scratch/synced_data  
  # BATCH CONFIGURATION
  BATCH_SIZE: 50  # Wait until we have 50 records before syncing


