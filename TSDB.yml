# TSDB.yml - Configuration for QuestDB, Kafka, and SISSA API
questdb:
  host: "localhost" #127.0.0.1  # Or 127.0.0.1:9000 
  port: 9000
  username: "admin"
  password: "quest"
  database: "qdb"
  

kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    raw_data: "raw_h2_data"
    validated_data: "h2_lab_data"
  
    
security:
  api_keys:
    sissa_hydor_01: ${SISSA_API_KEY_1}
    sissa_hydor_02: ${SISSA_API_KEY_2}    
  


# remote_sync:
#   enabled: true
#   method: ssh
#   ssh:
#     host: name_or_ip_of_target_machine
#     username: username
#     password: "your-password"  # Option 1 (not recommended)
#     # Your home directory path
#     #path: "/u/mdmc/$username/synced_data"
#     #key_path: "~/.ssh/id_rsa"  # Option 2 (recommended)
#     #key_path: /home/$username/.ssh/id_rsa
#     # OR if you have scratch access
#     path: /scratch/synced_data  
#   # BATCH CONFIGURATION
BATCH_SIZE: 50  # Wait until we have 50 records before syncing


remote_sync:
  enabled: true
  method: ssh
  ssh:
    host: 192.168.1.23
    password: "xxxxxxxxxxxxxxxx"  # Option 1 (not recommended)
    username: username
    #key_path: "~/.ssh/id_rsa"  # Option 2 (recommended)
    key_path: /home/$username/.ssh/id_ed25519  # Your ED25519 key
    path: "/home/$username/synced_data"
    allow_agent: false  # Don't use SSH agent
    look_for_keys: false  # Don't look for SSH keys
    timeout: 10


